<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <rect width="320" height="120" rx="12" fill="#F0FDF4"/>
  <path d="M0 65 Q90 45 180 70 T320 55 L320 120 L0 120 Z" fill="#DCFCE7" opacity="0.4"/>

  <!-- ORIGINAL GOOGLE MESSAGES / SMS APP ICON (Blue Squircle with White Chat Bubble) -->
  <g transform="translate(24, 20)">
    <rect width="76" height="76" rx="18" fill="#1A73E8" filter="drop-shadow(0 4px 8px rgba(26,115,232,0.3))"/>
    <!-- Speech bubble body -->
    <path d="M38 18 C26 18 16 27 16 38 C16 43 18 47 21 51 L18 60 L28 57 C31 58 34 58 38 58 C50 58 60 49 60 38 C60 27 50 18 38 18 Z" fill="#FFFFFF"/>
    <!-- Blue SMS message lines inside bubble -->
    <rect x="26" y="30" width="24" height="4" rx="2" fill="#1A73E8"/>
    <rect x="26" y="38" width="16" height="4" rx="2" fill="#1A73E8"/>
    <text x="38" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="middle">Messages</text>
  </g>

  <!-- Scam Warning & Security Shield Protection -->
  <g transform="translate(126, 16)">
    <!-- Fake OTP Text Message Card -->
    <g transform="translate(0, 0)">
      <rect width="105" height="52" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" filter="drop-shadow(0 2px 6px rgba(220,38,38,0.12))"/>
      <g transform="translate(8, 8)">
        <!-- Warning Icon -->
        <polygon points="6,0 12,11 0,11" fill="#DC2626"/>
        <line x1="6" y1="4" x2="6" y2="7" stroke="#FFFFFF" stroke-width="1.2"/>
        <circle cx="6" cy="9" r="0.6" fill="#FFFFFF"/>
        <text x="16" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#DC2626">Urgent OTP!</text>
      </g>
      <text x="8" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#1E293B">"Send code 4921 now"</text>
      <!-- Big Red STOP Bar -->
      <rect x="8" y="34" width="89" height="12" rx="3" fill="#FEE2E2"/>
      <text x="52" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="700" fill="#991B1B" text-anchor="middle">🚫 NEVER SHARE CODE</text>
    </g>

    <!-- Official Verified Shield Protection Badge -->
    <g transform="translate(118, 0)">
      <!-- Official Shield SVG -->
      <path d="M30 0 L58 10 C58 35 44 54 30 62 C16 54 2 35 2 10 Z" fill="#059669" filter="drop-shadow(0 4px 6px rgba(5,150,105,0.25))"/>
      <path d="M30 4 L54 13 C54 34 42 50 30 58 C18 50 6 34 6 13 Z" fill="#10B981"/>
      <!-- Crisp Checkmark -->
      <path d="M22 28 L28 34 L40 20" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="30" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#065F46" text-anchor="middle">Protected</text>
    </g>

    <!-- Safety Principle Callout -->
    <g transform="translate(0, 60)">
      <rect width="105" height="24" rx="6" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
      <text x="52" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#166534" text-anchor="middle">✓ Always Safe Here</text>
    </g>
  </g>
</svg>
