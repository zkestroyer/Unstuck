<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#E2E8F0"/>
  <circle cx="100" cy="115" r="50" fill="#CBD5E1"/>
  <!-- Cat Ears -->
  <polygon points="65,85 75,50 95,75" fill="#94A3B8"/>
  <polygon points="135,85 125,50 105,75" fill="#94A3B8"/>
  <!-- Eyes -->
  <circle cx="85" cy="110" r="6" fill="#1E293B"/>
  <circle cx="115" cy="110" r="6" fill="#1E293B"/>
  <!-- Nose and mouth -->
  <polygon points="98,122 102,122 100,126" fill="#F472B6"/>
  <path d="M95,130 Q100,135 105,130" stroke="#1E293B" stroke-width="2" fill="none"/>
  <!-- Whiskers -->
  <line x1="60" y1="120" x2="80" y2="122" stroke="#64748B" stroke-width="2"/>
  <line x1="60" y1="128" x2="80" y2="126" stroke="#64748B" stroke-width="2"/>
  <line x1="140" y1="120" x2="120" y2="122" stroke="#64748B" stroke-width="2"/>
  <line x1="140" y1="128" x2="120" y2="126" stroke="#64748B" stroke-width="2"/>
  <text x="100" y="180" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">My Cat</text>
</svg>
