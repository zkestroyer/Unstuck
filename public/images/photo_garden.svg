<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#DCFCE7"/>
  <!-- Sun -->
  <circle cx="160" cy="40" r="20" fill="#FDE047"/>
  <!-- Stems -->
  <line x1="70" y1="160" x2="70" y2="105" stroke="#15803D" stroke-width="4"/>
  <line x1="100" y1="160" x2="100" y2="90" stroke="#15803D" stroke-width="4"/>
  <line x1="130" y1="160" x2="130" y2="110" stroke="#15803D" stroke-width="4"/>
  <!-- Flower 1 (Pink) -->
  <circle cx="70" cy="100" r="16" fill="#F472B6"/>
  <circle cx="70" cy="100" r="7" fill="#FEF08A"/>
  <!-- Flower 2 (Red/Orange) -->
  <circle cx="100" cy="85" r="18" fill="#FB7185"/>
  <circle cx="100" cy="85" r="8" fill="#FEF08A"/>
  <!-- Flower 3 (Purple) -->
  <circle cx="130" cy="105" r="15" fill="#C084FC"/>
  <circle cx="130" cy="105" r="6" fill="#FEF08A"/>
  <!-- Grass -->
  <rect y="155" width="200" height="45" fill="#86EFAC"/>
  <text x="100" y="185" font-family="sans-serif" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">Garden Flowers</text>
</svg>
