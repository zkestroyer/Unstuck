<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <rect width="320" height="120" rx="12" fill="#E7F7EF"/>
  <!-- Decorative chat wallpaper shapes -->
  <path d="M0 60 Q80 40 160 65 T320 50 L320 120 L0 120 Z" fill="#D4EFE0" opacity="0.4"/>

  <!-- ORIGINAL WHATSAPP APP ICON (Vibrant Green Squircle + White Phone Receiver) -->
  <g transform="translate(24, 20)">
    <!-- Shadow & App Squircle -->
    <rect width="76" height="76" rx="18" fill="#25D366" filter="drop-shadow(0 4px 8px rgba(37,211,102,0.35))"/>
    <!-- Speech bubble body -->
    <path d="M38 14 C25 14 15 24 15 36 C15 41 17 46 20 50 L17 60 L28 57 C31 58 34 59 38 59 C51 59 61 49 61 36 C61 24 51 14 38 14 Z" fill="#FFFFFF"/>
    <!-- Green phone receiver inside WhatsApp bubble -->
    <path d="M47 43 C46 45 44 46 42 46 C37 46 31 40 31 35 C31 33 32 31 34 30 L37 32 C38 33 38 34 37 35 L36 36 C37 38 39 40 41 41 L42 40 C43 39 44 39 45 40 L47 43 Z" fill="#25D366"/>
    <!-- App Label -->
    <text x="38" y="71" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#075E54" text-anchor="middle">WhatsApp</text>
  </g>

  <!-- Simulated WhatsApp Chat Message with Attached Photo -->
  <g transform="translate(130, 16)">
    <!-- Outgoing WhatsApp Chat Bubble (Light Green) -->
    <rect width="165" height="88" rx="10" fill="#D9FDD3" stroke="#B8EBB0" stroke-width="1" filter="drop-shadow(0 2px 6px rgba(0,0,0,0.08))"/>
    
    <!-- Attached Photo Preview with frame -->
    <rect x="8" y="8" width="82" height="54" rx="6" fill="#FFFFFF"/>
    <rect x="10" y="10" width="78" height="50" rx="4" fill="#C7D2FE"/>
    <!-- Landscape mountains & sun illustration -->
    <circle cx="28" cy="24" r="5" fill="#F59E0B"/>
    <polygon points="12,58 32,38 48,50 62,34 86,58" fill="#10B981"/>
    <text x="49" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#075E54" text-anchor="middle">Photo (Garden)</text>

    <!-- WhatsApp Paperclip & Gallery Action Indicators -->
    <g transform="translate(100, 12)">
      <!-- Authentic WhatsApp Purple Gallery Icon Circle -->
      <circle cx="16" cy="16" r="16" fill="#AC44CF" filter="drop-shadow(0 2px 4px rgba(172,68,207,0.3))"/>
      <!-- Gallery icon symbol -->
      <rect x="8" y="8" width="16" height="16" rx="3" fill="#FFFFFF"/>
      <circle cx="12" cy="13" r="1.5" fill="#AC44CF"/>
      <polygon points="9,22 14,17 17,20 20,16 23,22" fill="#AC44CF"/>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#075E54" text-anchor="middle">Gallery</text>
    </g>

    <g transform="translate(136, 12)">
      <!-- Authentic WhatsApp Green Send Button -->
      <circle cx="16" cy="16" r="16" fill="#00A884" filter="drop-shadow(0 2px 4px rgba(0,168,132,0.3))"/>
      <!-- Send paper plane icon -->
      <path d="M10 16 L22 10 L14 22 L13 17 L10 16 Z" fill="#FFFFFF"/>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#075E54" text-anchor="middle">Send</text>
    </g>

    <!-- Double Checkmark (Read Receipt) & Timestamp -->
    <g transform="translate(112, 72)">
      <text x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#667781">10:30 AM</text>
      <!-- Double blue tick -->
      <path d="M46 6 L49 9 L56 2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M50 6 L53 9 L60 2" fill="none" stroke="#53BDEB" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
